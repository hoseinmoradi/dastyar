services:
  # Local LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: dastyar-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    # --- GPU support (uncomment if you have an NVIDIA GPU + nvidia-container-toolkit) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot service that downloads the model, then exits
  model-init:
    image: ollama/ollama:latest
    container_name: dastyar-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  # FastAPI application
  app:
    build: .
    container_name: dastyar-app
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - MAX_TOKENS=${MAX_TOKENS:-512}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  ollama_data:
